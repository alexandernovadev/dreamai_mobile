<form class="entity-form" (submit)="onSubmit($event)">
  @for (field of fields(); track field.key) {
    <div class="entity-form__field">
      @switch (field.type) {
        @case ('text') {
          <app-input
            [label]="field.label"
            [value]="stringValue(field.key)"
            (valueChange)="setValue(field.key, $event)"
          />
        }
        @case ('textarea') {
          <app-textarea
            [label]="field.label"
            [value]="stringValue(field.key)"
            (valueChange)="setValue(field.key, $event)"
          />
        }
        @case ('switch') {
          <app-switch
            [label]="field.label"
            [checked]="boolValue(field.key)"
            (checkedChange)="setValue(field.key, $event)"
          />
        }
        @case ('select') {
          <app-select
            [label]="field.label"
            [options]="field.options ?? []"
            [value]="stringOrNullValue(field.key)"
            (valueChange)="setValue(field.key, $event)"
          />
        }
        @case ('slider') {
          <app-slider
            [label]="field.label"
            [min]="field.min ?? 0"
            [max]="field.max ?? 10"
            [value]="numberValue(field.key)"
            (valueChange)="setValue(field.key, $event)"
          />
        }
        @case ('image') {
          <app-image-upload-field
            [label]="field.label"
            [value]="stringOrNullValue(field.key)"
            (valueChange)="setValue(field.key, $event)"
            (fileSelected)="onImagePicked(field.key, $event)"
          />
        }
      }
    </div>
  }

  <div class="entity-form__actions">
    <app-button type="button" variant="ghost" (pressed)="cancel.emit()">
      Cancelar
    </app-button>
    <app-button
      type="submit"
      variant="primary"
      [loading]="saving()"
      [disabled]="!isValid()"
    >
      {{ mode() === 'edit' ? 'Guardar cambios' : 'Crear y adjuntar' }}
    </app-button>
  </div>
</form>
