<div class="tabs" role="tablist">
  @for (t of tabs(); track t.id; let i = $index) {
    <button
      #tabBtn
      type="button"
      role="tab"
      class="tabs__item"
      [class.tabs__item--active]="t.id === active()"
      [attr.aria-selected]="t.id === active()"
      [tabIndex]="t.id === active() ? 0 : -1"
      [disabled]="t.locked"
      (click)="active.set(t.id)"
      (keydown)="onKeydown($event, i)"
    >
      {{ t.label }}
    </button>
  }
</div>
